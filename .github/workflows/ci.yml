name: continuum-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run eval:generate && git diff --exit-code -- evals/memory-gauntlet.json
      - run: npm run eval
      - run: npm run bench:ci
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-evidence
          path: evals/results/reference.json
